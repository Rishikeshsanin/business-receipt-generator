name: Bug report
description: Report a reproducible problem in Business Receipt Generator
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Please do not include real customer receipt data.

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem clearly.
      placeholder: Tell us what you expected and what happened instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the app
        2. Select...
        3. Enter...
        4. Click...
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser
      placeholder: Chrome 151, Edge, Safari, Firefox...
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device / operating system
      placeholder: Windows 11 desktop, Android phone, iPhone...
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Item search / suggestions
        - Item quantity / pricing
        - Discount / totals
        - Receipt preview
        - PDF download
        - Printing / printer device
        - Responsive / mobile UI
        - Privacy / storage behavior
        - Other
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or console errors
      description: Add sanitized screenshots or errors if useful. Do not include private customer information.

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed real customer/private receipt data from this report.
          required: true
